name: Publish game and iPhone reports

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare game files
        run: |
          mkdir -p site
          cp index.html styles.css app.js game.js accessories.js shortcut-log.js sw.js manifest.webmanifest icon.svg .nojekyll site/
          cp -R assets site/assets
      - name: Encrypt current iPhone reports
        env:
          OWNER_GAME_KEY: ${{ secrets.OWNER_GAME_KEY }}
        run: node scripts/build-feed.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
